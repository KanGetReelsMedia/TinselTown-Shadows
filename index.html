:root {
  --gold: #d4af37;
  --gold-dim: #a68a2e;
  --bg: #07070a;
  --panel: rgba(12, 12, 14, 0.88);
  --text: #e8e6e1;
  --safe-area-inset-top: env(safe-area-inset-top);
  --safe-area-inset-bottom: env(safe-area-inset-bottom);
}
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  background: #050507;
  color: var(--text);
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #07070a;
    --panel: rgba(12, 12, 14, 0.92);
  }
}
/* grain keyframes */
@keyframes grainMove {
  0% {
    transform: translate(0,0);
  }
  25% {
    transform: translate(-2%, -1%);
  }
  50% {
    transform: translate(1%, 2%);
  }
  75% {
    transform: translate(2%, -2%);
  }
  100% {
    transform: translate(0,0);
  }
}
@keyframes rainFall {
  0% {
    transform: translateY(-100vh) translateX(0);
    opacity: 0;
  }
  10% {
    opacity: 0.5;
  }
  90% {
    opacity: 0.3;
  }
  100% {
    transform: translateY(100vh) translateX(-20px);
    opacity: 0;
  }
}
@keyframes titleIn {
  0% {
    opacity: 0;
    letter-spacing: 0.5em;
    filter: blur(8px);
  }
  40% {
    opacity: 1;
    letter-spacing: 0.15em;
    filter: blur(0);
  }
  80% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateY(-10px);
  }
}
@keyframes flicker {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.92;
  }
  52% {
    opacity: 0.7;
  }
  54% {
    opacity: 1;
  }
}

stile:{id:"s3_hostile",speaker:"OFFICER RUIZ",dir:"He squints at your old badge wallet. The leather is cracked. The photo is younger. His lip curls.",text:"Logs say local PD only. You don’t look local. Central says no consultants. That badge looks like it was lost in ’43. Try again in the morning, “Detective.”",focus:"ruiz",onEnter:(e)=>({hasBadgeFlashed:!0,suspicion:{...e.suspicion,ruiz:e.suspicion.ruiz+2}})},s3b_choice:{id:"s3b_choice",speaker:"ELIAS THORNTON",dir:"Red herring: Ruiz squares up. You can hear his partner chuckling behind the cruiser. Your badge trick burned goodwill. But that gold glint is still there, untouched by rain.",text:"Damn kid. Egos bruise easier than evidence. You could keep pushing tin, or you could use what the rain didn’t wash away.",focus:"elias",type:"choice",options:[{label:"Press harder. “Call Sergeant Frey. Now.”",value:"badge_again",hint:"Authority • Risky"},{label:"Crouch. Examine the gold tip near his heel",value:"examine_after_badge",hint:"Observation • Redeem",isClue:!0}]},s3c_fail:{id:"s3c_fail",speaker:"OFFICER RUIZ",dir:"He puts a hand on your chest. Not hard. Just enough. The precinct light flickers.",text:"I said move along. Last chance before I make this your problem too. You think Frey likes guys like you hanging around his scenes?",focus:"ruiz",next:"s3b_choice"},s4_intro:{id:"s4_intro",speaker:"ELIAS THORNTON",dir:"You spot a crushed gold-tipped cigarette butt. Luxor Gold — rare, expensive, and bone dry despite the rain hammering for over an hour.",text:"That Luxor Gold near your boot... someone dropped that after the rain started. Under your watch. Fifty-cent import. Gold foil still bright. In this weather? That butt should be pulp.",focus:"elias",next:"s5_inspect"},s5_inspect:{id:"s5_inspect",speaker:"EVIDENCE: LUXOR GOLD #1",dir:"PUZZLE 01 // OBSERVATION PROTOCOL: Rain has been falling since midnight. This butt is dry. How? Tap the two anomalies.",text:"Observation mode. The cigarette lies half-crushed. Two details separate fact from theater: moisture level vs. brand marking. Inspect both to log the clue.",focus:"none",type:"inspect"},s6_leverage:{id:"s6_leverage",speaker:"ELIAS THORNTON",dir:"You hold the butt with your handkerchief, dry as a courtroom lie. Ruiz stares.",text:"That Luxor Gold near your boot... someone dropped that after the rain started. Under your watch. You want to explain to your Sergeant how a dry cigarette survives a downpour? Or you want to let me through and pretend you found it?",focus:"elias",next:"s7_flustered"},s7_flustered:{id:"s7_flustered",speaker:"OFFICER RUIZ",dir:"His Adam’s apple bobs. The rain is loud enough to hide a lot. Not this.",text:"I... I didn’t see anyone... How did you know what brand—? Christ, Sarge said no one comes in but — Look, I was just — I was watching the street, not the ground!",focus:"ruiz",next:"s8_frey"},s8_frey:{id:"s8_frey",speaker:"DAN FREY",dir:"A heavy hand lands on Ruiz’s shoulder. Sergeant Dan Frey steps into the flickering light. Smells like cheap coffee and cheaper cigars. He knows you. He wishes he didn’t.",text:"Let him through, Ruiz. If he spotted that Luxor, he’s already three steps ahead of you. Elias. Still chasing shadows that don’t want to be found? Still smoking ghosts?",focus:"dan",next:"s9_reply"},s9_reply:{id:"s9_reply",speaker:"ELIAS THORNTON",dir:"Frey is your old precinct partner. He made sergeant. You made “discreet inquiries.” History sits between you like a loaded ashtray.",text:"Frey. Still smoking the cheap stuff, I see. Two years and you still park Ruiz on evidence duty? Kid’s got clean boots and dirty attention.",focus:"elias",next:"s10_frey_pressure_intro"},s10_frey_pressure_intro:{id:"s10_frey_pressure_intro",speaker:"DAN FREY",dir:"Frey pulls you aside. The alley stinks of rain and copper. He lowers his voice. The coroner’s van idles.",text:"Truth? In Hollywood? You’re looking in the wrong place, Elias. Vic was a nobody, this is a nobody case. But you think it’s Luxor man, don’t you? Give me something real — not nostalgia.",focus:"dan",next:"s11_pressure"},s11_pressure:{id:"s11_pressure",speaker:"DAN FREY — PRESSURE TEST",dir:"PUZZLE 02 // DIALOGUE PRESSURE: Frey wants cause, not coffee talk. Three angles. Only one survives the rain. Red herring: money, reputation. Truth: timeline.",text:"Pick your leverage. Get it wrong and he walks you out into the rain. Get it right and he owes you ten minutes.",focus:"dan",type:"pressure",options:[{label:"The Money Angle: “Luxor means money. Producer, money, motive.”",value:"money",hint:"Red herring • Weak"},{label:"The Timeline Angle: “Dry in a downpour = killer still here, 10 mins max.”",value:"timeline",hint:"Observation • Strong"},{label:"The Reputation Angle: “You owe me for Central, Frey.”",value:"reputation",hint:"History • Risky"}]},s12_success:{id:"s12_success",speaker:"DAN FREY",dir:"He looks at the alley mouth, at Ruiz, at the rain hammering the canvas. Something clicks behind his eyes. Old cop math.",text:"Dry in the rain, huh? Hell. That means our boy was here in the last ten minutes. While Ruiz was posing for the newsreel. Alright, Thornton. You got ten minutes before I have to log you. Body’s this way. Don’t touch nothing.",focus:"dan",next:"s13_closing"},s12_partial:{id:"s12_partial",speaker:"DAN FREY",dir:"He scoffs, but not unkindly. He’s tired. You’re both tired.",text:"Rich boy smokes Luxor, sure. Half the producers on Sunset do. That’s not probable cause, that’s gossip column crap. You’re better than that, Elias. Try again — make it count. The rain don’t lie.",focus:"dan",next:"s11_pressure",onEnter:(e)=>({suspicion:{...e.suspicion,frey:e.suspicion.frey+1},attempts:{pressure:e.attempts.pressure+1}})},s12_fail:{id:"s12_fail",speaker:"DAN FREY",dir:"His jaw tightens. He’s done playing alumni association.",text:"You think I care about my record? Kid, I’ve been on this beat since you were stealing milk money. You got nothing but a wet theory and a dry smoke. Last shot.",focus:"dan",next:"s11_pressure",onEnter:(e)=>({suspicion:{...e.suspicion,frey:e.suspicion.frey+2},attempts:{pressure:e.attempts.pressure+1}})},s13_closing:{id:"s13_closing",speaker:"ELIAS THORNTON [Internal]",dir:"The coroner lifts the sheet. You don’t see a nobody. You see a message. Lipstick on a collar. Gold dust on the fingers. Luxor ash on a dead boy’s lapel.",text:"One Luxor Gold. One dead kid who wasn’t nobody. And Frey just gave me ten minutes to be wrong in all the right ways. Rain drums the canvas. Hollywood keeps its secrets. But tonight, so do I.",focus:"elias",next:"s14_end"},s14_end:{id:"s14_end",speaker:"SYSTEM",dir:"CHAPTER 1 COMPLETE // Evidence logged. Suspicion measured. Access key generated from playthrough.",text:"The alley keeps its secrets. But you kept one too. The Luxor is dry. The timeline is narrow. And someone rich enough to smoke fifty-cent cigarettes is nervous tonight. Chapter 2 awaits — if you have the key.",focus:"none",type:"end"}};function T0(e){let n=0;for(let t=0;t<e.length;t++)n=n*31+e.charCodeAt(t)>>>0;return(n%4095).toString(16).toUpperCase().padStart(3,"0")}function R0(e){let t=e.clues.some((o)=>o.id==="luxor")?"LUXOR":"BLIND",r=e.path.join("-")+`-${e.hasBadgeFlashed?"BADGE":"EYES"}-R${e.suspicion.ruiz}F${e.suspicion.frey}`,l=T0(r);return`THTN-${t}-${l}`}var oi=({id:e,focused:n,visible:t,imgFailed:r,onError:l})=>{let o={elias:"https://upinthepast.com/wp-content/uploads/2026/01/1000025013-removebg-preview.png",ruiz:"https://upinthepast.com/wp-content/uploads/2026/01/Gemini_Generated_Image_x3qvxsx3qvxsx3qv-removebg-preview.png",dan:"https://upinthepast.com/wp-content/uploads/2026/01/Gemini_Generated_Image_2ptb2o2ptb2o2ptb-removebg-preview.png"},u={elias:"ET",ruiz:"JR",dan:"DF"},i={elias:"ELIAS THORNTON",ruiz:"OFFICER RUIZ",dan:"SGT. DAN FREY"};return S("div",{className:`absolute bottom-0 transition-all duration-700 ease-[cubic-bezier(0.25,1,0.5,1)] will-change-transform select-none
